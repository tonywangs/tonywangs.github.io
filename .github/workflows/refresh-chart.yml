name: Refresh contribution chart
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-chart
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate chart
        run: python3 scripts/refresh-github-chart.py
      - name: Save updated chart
        run: |
          git add images/github-contributions.svg dist/client/images/github-contributions.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh contribution chart"
          git push
